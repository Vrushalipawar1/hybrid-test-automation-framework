# Override any of these from the command line, e.g.  mvn test -Dbrowser=firefox -Dheadless=false

# --- browser ---
browser=chrome
headless=true
# local | remote (remote = Selenium Grid / Docker container, see docker-compose.yml)
execution=local
remote.url=http://localhost:4444/wd/hub

# --- waits ---
explicit.wait.seconds=10
page.load.timeout.seconds=30

# --- applications under test (public practice sites) ---
base.url=https://www.saucedemo.com
api.base.url=https://restful-booker.herokuapp.com

# --- credentials for the practice sites (these are published on the sites themselves) ---
ui.username=standard_user
ui.password=secret_sauce
api.username=admin
api.password=password123

# --- flaky-test handling: how many times a failed test is re-run ---
retry.count=1
